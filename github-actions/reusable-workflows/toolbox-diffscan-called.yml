name: FossID DiffScan - Reusable Workflow

on:
  workflow_call:
    secrets:
      QUAY_USER:
        required: true
      QUAY_TOKEN:
        required: true
      KB_URL:
        required: true
      KB_TOKEN:
        required: true
    inputs:
      fail-on-any-issues:
        description: 'Set to 1 to fail the pipeline when issues are detected'
        type: string
        default: '0'
        required: false

jobs:
  run-diffscan:
    name: Run FossID DiffScan
    runs-on: ubuntu-latest
    container:
      image: quay.io/fossid/fossid-toolbox:latest
      credentials:
        username: ${{ secrets.QUAY_USER }}
        password: ${{ secrets.QUAY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run DiffScan
        run: |
          # --fail is a boolean flag, so the 0/1 input is translated here rather
          # than passed through. The input name is kept for callers' benefit.
          FAIL_FLAG=""
          if [ "${{ inputs.fail-on-any-issues }}" = "1" ]; then
            FAIL_FLAG="--fail"
          fi

          fossid \
          diffscan \
          --host ${{ secrets.KB_URL }} \
          --token ${{ secrets.KB_TOKEN }} \
          --format github \
          $FAIL_FLAG
